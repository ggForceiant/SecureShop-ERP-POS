<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureShop - Secure ERP & Store</title>
    <!-- Font Awesome İkonları -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="logo-section" onclick="window.showStorefront()">
            <div class="logo-shield">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <div class="logo-text">
                <h1>SecureShop</h1>
                <p>OWASP Compliant ERP</p>
            </div>
        </div>

        <div class="nav-buttons">
            <button onclick="window.toggleCartModal()" class="btn-cart-nav">
                <i class="fa-solid fa-basket-shopping"></i> Səbət ( <span id="cart-count">0</span> )
            </button>
            <div id="auth-buttons"></div>
        </div>
    </header>

    <!-- Public Storefront (Əsas Kataloq) -->
    <section id="storefront-section" class="storefront-section">
        <div class="section-header">
            <h2>
                <i class="fa-solid fa-store"></i> Məhsul Kataloqu
            </h2>
            <input type="text" id="public-search" onkeyup="window.filterPublicProducts()" placeholder="Axtar..." class="search-input">
        </div>
        <div id="public-products-grid" class="product-grid"></div>
    </section>

    <!-- Single Product Details Section (Məhsul Detalları Səhifəsi) -->
    <section id="product-detail-section" class="storefront-section" style="display: none;">
        <button onclick="window.showStorefront()" class="btn-action btn-edit" style="margin-bottom: 20px; padding: 10px 18px;">
            <i class="fa-solid fa-arrow-left"></i> Kataloqa Qayıt
        </button>
        
        <div class="product-detail-card">
            <!-- Sol Hissə: Şəkillər və Galereya -->
            <div class="detail-gallery-container">
                <div class="main-image-box">
                    <img id="detail-main-img" src="" alt="Məhsul">
                </div>
                <div id="detail-thumbs-grid" class="thumbs-grid"></div>
            </div>

            <!-- Sağ Hissə: Məhsul Məlumatları -->
            <div class="detail-info-box">
                <h2 id="detail-title"></h2>
                <div class="detail-price-row">
                    <span id="detail-price" class="price-tag" style="font-size: 1.5rem;"></span>
                    <span id="detail-stock-badge" class="stock-badge" style="position: static; font-size: 0.85rem;"></span>
                </div>
                
                <div class="detail-description-box">
                    <h4>Məhsul Haqqında</h4>
                    <p id="detail-description"></p>
                </div>

                <button id="detail-add-cart-btn" class="btn-submit" style="margin-top: 20px; padding: 14px;">
                    <i class="fa-solid fa-cart-plus"></i> Səbətə Əlavə Et
                </button>
            </div>
        </div>

        <!-- Oxşar / Benzer Məhsullar Bölməsi -->
        <div style="margin-top: 50px;">
            <h3 style="margin-bottom: 20px; color: #cbd5e1; border-bottom: 1px solid #1e293b; padding-bottom: 10px;">
                <i class="fa-solid fa-layer-group"></i> Oxşar Məhsullar
            </h3>
            <div id="similar-products-grid" class="product-grid"></div>
        </div>
    </section>

    <!-- Login Modal -->
    <div id="login-section" class="modal-overlay" style="display: none;">
        <div class="login-modal-card">
            <button onclick="window.showStorefront()" class="close-modal-btn"><i class="fa-solid fa-xmark"></i></button>
            <h2 style="margin-bottom: 20px; text-align: center;">Sistemə Giriş</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>İstifadəçi Adı</label>
                    <input type="text" id="username" required placeholder="İstifadəçi adı">
                </div>
                <div class="form-group">
                    <label>Şifrə</label>
                    <div style="position: relative; display: flex; align-items: center;">
                        <input type="password" id="password" required placeholder="••••••••" style="padding-right: 40px; width: 100%;">
                        <i id="toggle-password-icon" class="fa-solid fa-eye" onclick="window.togglePasswordVisibility()" style="position: absolute; right: 12px; cursor: pointer; color: #94a3b8;"></i>
                    </div>
                </div>
                <button type="submit" class="btn-submit">Giriş</button>
            </form>
            <div id="login-error" class="login-error-box" style="display: none; color: #f43f5e; margin-top: 10px; font-size: 0.8rem; text-align: center;"></div>
        </div>
    </div>

    <!-- ERP Dashboard -->
    <div id="dashboard-section" class="dashboard-section" style="display: none;">
        <div class="user-banner">
            <div>
                <h3 id="user-display"></h3>
                <p id="role-permissions-desc" style="color: #94a3b8; font-size: 0.8rem; margin-top: 4px;"></p>
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
                <button id="btn-add-product" onclick="window.toggleProductModal()" class="btn-action btn-sale" style="display: none; padding: 8px 16px;">
                    <i class="fa-solid fa-plus"></i> Yeni Məhsul Əlavə Et
                </button>
                <div id="role-badge" class="role-badge-box"></div>
            </div>
        </div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Məhsul Adı</th>
                        <th>Qiymət</th>
                        <th>Stok</th>
                        <th style="text-align: right;">Əməliyyat</th>
                    </tr>
                </thead>
                <tbody id="products-tbody"></tbody>
            </table>
        </div>
    </div>

    <!-- Səbət və Ödəniş Modalı -->
    <div id="cart-modal" class="modal-overlay" style="display: none;">
        <div class="cart-modal-card" style="max-width: 500px;">
            <div class="cart-header">
                <h3>Məhsul Səbəti və Ödəniş</h3>
                <button onclick="window.toggleCartModal()" class="close-modal-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div id="cart-items" class="cart-items-container" style="max-height: 180px; overflow-y: auto;"></div>
            
            <div class="cart-summary-row">
                <span>Cəmi:</span>
                <span id="cart-total" style="color: #818cf8;">0.00 AZN</span>
            </div>

            <!-- MÜŞTƏRİ VƏ ÖDƏNİŞ MƏLUMATLARI FORM-U -->
            <form id="checkout-form" onsubmit="window.submitCheckout(event)" style="border-top: 1px solid #1e293b; padding-top: 16px; margin-top: 10px;">
                <div class="form-group">
                    <label>Ad və Soyad</label>
                    <input type="text" id="cust-name" required placeholder="Əli Zeynalov">
                </div>
                <div class="form-group">
                    <label>Əlaqə Nömrəsi</label>
                    <input type="tel" id="cust-phone" required placeholder="+994 50 123 45 67">
                </div>
                <div class="form-group">
                    <label>Kart Nömrəsi (16 Rəqəm)</label>
                    <input type="text" id="card-num" maxlength="16" required placeholder="4127123456789012">
                </div>
                <div style="display: flex; gap: 12px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Bitmə Tarixi</label>
                        <input type="text" id="card-exp" maxlength="5" required placeholder="MM/YY">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>CVV/CVC</label>
                        <input type="password" id="card-cvv" maxlength="3" required placeholder="123">
                    </div>
                </div>
                <button type="submit" class="btn-checkout" style="margin-top: 10px;">Ödənişi Təsdiqlə və Sifariş Et</button>
            </form>
        </div>
    </div>

    <!-- Yeni Məhsul Əlavə Etmə Modalı -->
    <div id="product-modal" class="modal-overlay" style="display: none;">
        <div class="login-modal-card" style="max-width: 520px;">
            <button onclick="window.toggleProductModal()" class="close-modal-btn"><i class="fa-solid fa-xmark"></i></button>
            <h2 style="margin-bottom: 20px; text-align: center;">Yeni Məhsul Əlavə Et</h2>
            <form id="add-product-form" onsubmit="window.submitAddProduct(event)">
                <div class="form-group">
                    <label>Məhsul Adı</label>
                    <input type="text" id="new-prod-name" required placeholder="Məs: Dell XPS 15 Noutbuk">
                </div>
                <div style="display: flex; gap: 12px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Qiymət (AZN)</label>
                        <input type="number" step="0.01" id="new-prod-price" required placeholder="1250.00">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Stok Miqdarı</label>
                        <input type="number" id="new-prod-stock" required placeholder="10">
                    </div>
                </div>
                <div class="form-group">
                    <label>Əsas Şəkil URL-i</label>
                    <input type="url" id="new-prod-image" placeholder="https://images.unsplash.com/photo-...">
                </div>
                <div class="form-group">
                    <label>Məhsul Haqqında Ətraflı Məlumat (Description)</label>
                    <textarea id="new-prod-desc" rows="3" style="width: 100%; background-color: #0b0f19; border: 1px solid #1e293b; border-radius: 10px; padding: 10px; color: white; resize: vertical;" placeholder="Məhsulun xüsusiyyətlərini bura yazın..."></textarea>
                </div>
                <div class="form-group">
                    <label>Əlavə Şəkillər (Vergüllə ayırın)</label>
                    <input type="text" id="new-prod-gallery" placeholder="https://link1.jpg, https://link2.jpg">
                </div>
                <button type="submit" class="btn-submit">Əlavə Et</button>
            </form>
        </div>
    </div>

    <!-- Məhsul Redaktə Etmə Modalı (UPDATE) -->
    <div id="edit-product-modal" class="modal-overlay" style="display: none;">
        <div class="login-modal-card" style="max-width: 520px;">
            <button onclick="window.toggleEditProductModal()" class="close-modal-btn"><i class="fa-solid fa-xmark"></i></button>
            <h2 style="margin-bottom: 20px; text-align: center;">Məhsulu Redaktə Et</h2>
            <form id="edit-product-form" onsubmit="window.submitEditProduct(event)">
                <input type="hidden" id="edit-prod-id">
                <div class="form-group">
                    <label>Məhsul Adı</label>
                    <input type="text" id="edit-prod-name" required>
                </div>
                <div style="display: flex; gap: 12px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Qiymət (AZN)</label>
                        <input type="number" step="0.01" id="edit-prod-price" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Stok Miqdarı</label>
                        <input type="number" id="edit-prod-stock" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Əsas Şəkil URL-i</label>
                    <input type="url" id="edit-prod-image">
                </div>
                <div class="form-group">
                    <label>Məhsul Haqqında Ətraflı Məlumat (Description)</label>
                    <textarea id="edit-prod-desc" rows="3" style="width: 100%; background-color: #0b0f19; border: 1px solid #1e293b; border-radius: 10px; padding: 10px; color: white; resize: vertical;"></textarea>
                </div>
                <div class="form-group">
                    <label>Əlavə Şəkillər (Vergüllə ayırın)</label>
                    <input type="text" id="edit-prod-gallery">
                </div>
                <button type="submit" class="btn-submit" style="background-color: #6366f1;">Yenilə və Yadda Saxla</button>
            </form>
        </div>
    </div>

    <!-- Floating WhatsApp Button -->
    <a href="https://wa.me/994555617699" target="_blank" class="whatsapp-float" title="WhatsApp ilə əlaqə">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <script src="app.js"></script>
</body>
</html>
