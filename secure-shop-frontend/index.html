<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureShop - Secure ERP & Store</title>
    <!-- Font Awesome İkonaları -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="logo-section" onclick="window.showStorefront()">
            <div class="logo-shield">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <div class="logo-text">
                <h1>SecureShop</h1>
                <p>OWASP Compliant ERP</p>
            </div>
        </div>

        <div class="nav-buttons">
            <button onclick="window.toggleCartModal()" class="btn-cart-nav">
                <i class="fa-solid fa-basket-shopping"></i> Səbət ( <span id="cart-count">0</span> )
            </button>
            <div id="auth-buttons"></div>
        </div>
    </header>

    <!-- Public Storefront -->
    <section id="storefront-section" class="storefront-section">
        <div class="section-header">
            <h2>
                <i class="fa-solid fa-store"></i> Məhsul Kataloqu
            </h2>
            <input type="text" id="public-search" onkeyup="window.filterPublicProducts()" placeholder="Axtar..." class="search-input">
        </div>
        <div id="public-products-grid" class="product-grid"></div>
    </section>

    <!-- Login Modal -->
    <div id="login-section" class="modal-overlay hidden">
        <div class="login-modal-card">
            <button onclick="window.showStorefront()" class="close-modal-btn"><i class="fa-solid fa-xmark"></i></button>
            <h2>Sistemə Giriş</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>İstifadəçi Adı</label>
                    <input type="text" id="username" required placeholder="İstifadəçi adınızı daxil edin">
                </div>
                <div class="form-group">
                    <label>Şifrə</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-submit">Giriş</button>
            </form>
            <div id="login-error" class="login-error-box hidden"></div>
        </div>
    </div>

    <!-- ERP Dashboard -->
    <div id="dashboard-section" class="dashboard-section hidden">
        <div class="user-banner">
            <div>
                <h3 id="user-display"></h3>
                <p id="role-permissions-desc"></p>
            </div>
            <div id="role-badge" class="role-badge-box"></div>
        </div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Məhsul Adı</th>
                        <th>Qiymət</th>
                        <th>Stok</th>
                        <th style="text-align: right;">Əməliyyat</th>
                    </tr>
                </thead>
                <tbody id="products-tbody"></tbody>
            </table>
        </div>
    </div>

    <!-- Səbət Modalı -->
    <div id="cart-modal" class="modal-overlay hidden">
        <div class="cart-modal-card">
            <div class="cart-header">
                <h3>Məhsul Səbəti</h3>
                <button onclick="window.toggleCartModal()" class="close-modal-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="cart-items" class="cart-items-container"></div>
            <div class="cart-summary-row">
                <span>Cəmi:</span>
                <span id="cart-total">0.00 AZN</span>
            </div>
            <button onclick="window.checkoutCart()" class="btn-checkout">Sifarişi Tamamla</button>
        </div>
    </div>

    <!-- Sona yükləyirik ki DOM elementləri hazır olsun -->
    <script src="app.js"></script>
</body>
</html>
